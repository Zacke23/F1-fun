<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 Telemetry Desk</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:ital,wght@0,600;1,700;1,800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{color-scheme:dark;--ground:#0e0f24;--panel:#171936;--ink:#eceefb;--mute:#9a9ec6;--line:#2a2d57;--indigo:#241f68;--purple:#9a4dff;--green:#19c06a;--red:#f0261c}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:500 16px/1.5 Barlow,system-ui,sans-serif}
.hero{background:linear-gradient(115deg,var(--indigo) 60%,#2e2878);color:#fff;clip-path:polygon(0 0,100% 0,100% calc(100% - 34px),0 100%);padding:34px clamp(16px,4vw,40px) 80px}
.hero-in{max-width:1100px;margin:0 auto}
h1{margin:0;font:italic 800 clamp(2.4rem,7vw,4.6rem)/1 "Barlow Condensed",Impact,sans-serif}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:12px 0 22px;color:#c9c7ee;font-size:1.05rem}
.tag{background:var(--red);color:#fff;font:italic 700 1.1rem "Barlow Condensed",sans-serif;padding:3px 18px 3px 12px;clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.tag:empty{display:none}
main{max-width:1100px;margin:8px auto 0;padding:0 clamp(16px,4vw,40px) 60px;position:relative}
.pick{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:16px;align-items:flex-end}
label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--mute)}
select{font:inherit;color:var(--ink);padding:8px 10px;min-width:170px;border:1px solid var(--line);background:var(--panel);border-radius:6px}
.hero .pick{margin:0}.hero label{color:#b5b3e0}
.hero select{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.3)}
option{background:var(--panel);color:var(--ink)}
.tabs{display:flex;gap:6px;margin-bottom:18px;overflow-x:auto;padding-bottom:4px}
.tabs button{font:italic 700 1.1rem "Barlow Condensed",sans-serif;background:var(--panel);color:var(--ink);border:0;padding:9px 26px 9px 20px;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%);cursor:pointer;white-space:nowrap;transition:background .15s}
.tabs button:hover{background:#262957}
.tabs button[aria-selected=true]{background:var(--red);color:#fff}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
.tabs button:focus-visible{outline:0;box-shadow:inset 0 0 0 3px var(--ink)}
#msg{min-height:1.5em;margin:0 0 10px;color:var(--mute)}
#msg.err{color:#ff7b72;font-weight:600}
.wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:620px;font-variant-numeric:tabular-nums}
th,td{padding:10px 14px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#1e2045}
th{font-weight:600;color:var(--mute);font-size:.88rem}
.l{text-align:left}
.drv{display:inline-flex;align-items:center;gap:8px;font:italic 700 1.15rem "Barlow Condensed",sans-serif}
.drv i{display:inline-block;width:5px;height:20px;border-radius:2px}
small{color:var(--mute);margin-left:8px}
.p{background:var(--purple);color:#fff;font-weight:700}
.g{background:var(--green);color:#06210f;font-weight:700}
.pill{display:inline-block;min-width:70px;text-align:center;padding:2px 8px;border-radius:5px}
.key{color:var(--mute);margin:0 0 12px}
.key span{display:inline-block;padding:1px 9px;border-radius:4px;margin:0 6px 0 2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
.ch{position:relative;height:300px}
.chips,.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{font:italic 700 1.05rem "Barlow Condensed",sans-serif;padding:4px 14px;border:3px solid var(--c);background:var(--panel);color:var(--ink);border-radius:999px;cursor:pointer}
.chip.on{background:var(--ink);color:#14152e}
.chk{flex-direction:row;align-items:center;gap:8px;margin:0 0 14px;color:var(--ink)}
.empty{background:var(--panel);border:1px dashed var(--line);padding:24px;border-radius:8px;color:var(--mute)}
.cmp{font:italic 700 .95rem "Barlow Condensed",sans-serif;padding:2px 14px;border-radius:99px;border:1px solid var(--line)}
.srow{display:flex;align-items:center;gap:14px;padding:5px 0}
.srow .drv{width:76px;flex:none}
.bar{display:flex;flex:1;height:30px;gap:2px}
.seg{display:grid;place-items:center;font:700 .9rem "Barlow Condensed",sans-serif;border-radius:5px;min-width:2px;border:1px solid rgba(0,0,0,.1);overflow:hidden}
.meter{width:140px;height:8px;background:var(--ground);border-radius:9px}
.meter b{display:block;height:100%;background:var(--red);border-radius:9px}
.grad{display:flex;align-items:center;gap:10px;color:var(--mute);margin-top:10px}
.grad i{flex:0 1 240px;height:10px;border-radius:9px;background:linear-gradient(90deg,hsl(240 85% 50%),hsl(180 85% 50%),hsl(120 85% 50%),hsl(60 85% 50%),hsl(0 85% 50%))}
.map svg{display:block;width:100%;max-height:68vh}
.trk{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:14px;align-items:start}
.trk .card{margin-bottom:0}
@media(max-width:860px){.trk{grid-template-columns:1fr}}
.map{padding:10px}
.map svg{display:block;aspect-ratio:1.6;width:100%;height:auto;max-height:none;touch-action:none;cursor:grab;border-radius:6px;background:#10112b}
.ms{cursor:pointer;transition:opacity .15s}
svg.has .ms{opacity:.3}svg.has .ms.sel{opacity:1}
.mapbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.mapbar .legend,.mapbar .grad{margin:0}
.btn{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);padding:4px 12px;border-radius:6px;cursor:pointer}
.btn:hover{background:var(--line)}
#ro p{margin:8px 0}#ro small{display:block;margin:0}
.win{font-weight:600}
.y{background:#f5c400;color:#2b2200;font-weight:700}
.hero input{font:inherit;color:#fff;padding:8px 10px;min-width:190px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);border-radius:6px}
.hero input::placeholder{color:#a9a7d8}
.live{color:#fff;border-color:rgba(255,255,255,.4);padding:9px 18px;font-weight:600}
.live[aria-pressed=true]{background:var(--red);border-color:var(--red)}
#seg:empty{margin:0}
.tabs button[hidden]{display:none}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.content{min-width:0}
.side{background:#090a1b;border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font:italic 800 1.55rem/1.1 "Barlow Condensed",sans-serif;margin:4px 12px 20px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;text-align:left;font:600 .98rem/1.25 Barlow,system-ui,sans-serif;color:var(--mute);background:none;border:0;border-left:3px solid transparent;border-radius:8px;padding:10px 12px;cursor:pointer;transition:background .15s}
.nav button:hover{background:var(--panel);color:var(--ink)}
.nav button[aria-selected=true]{background:#1d1f45;color:var(--ink);border-left-color:var(--red)}
.nav button[hidden]{display:none}
.nav svg{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sec{font:italic 700 1.5rem "Barlow Condensed",sans-serif;margin:28px 0 10px}
#view>.sec:first-child{margin-top:4px}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}.brand{display:none}.nav{flex-direction:row;overflow-x:auto}.nav button{white-space:nowrap;border-left:0;border-bottom:3px solid transparent;border-radius:8px 8px 0 0}.nav button[aria-selected=true]{border-bottom-color:var(--red)}}
.radio{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 14px;margin-bottom:8px}
.radio audio{flex:1;min-width:220px;height:36px}
.rp{margin:10px 0 0;color:var(--mute)}.rp .drv{color:var(--ink)}
.mapbar input[type=range]{flex:1;min-width:150px;accent-color:var(--red)}
#rate{min-width:0}
tr[data-x]{cursor:pointer}
#sload{padding:9px 16px;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app"><nav class="side" aria-label="Pages"><p class="brand">F1 Telemetry Desk</p><div class="nav" id="tabs" role="tablist"></div></nav><div class="content">
<section class="hero"><div class="hero-in">
  <h1 id="gp">F1 Telemetry Desk</h1>
  <div class="meta"><span class="tag" id="sess"></span><span id="where">Lap times, sectors, tyres and car data from OpenF1</span></div>
  <div class="pick">
    <label>Season<select id="year"></select></label>
    <label>Grand Prix<select id="meeting"></select></label>
    <label>Session<select id="session"></select></label>
    <label>OpenF1 token (optional)<input id="tok" type="password" autocomplete="off" placeholder="Paste for live data"></label>
    <button class="btn live" id="live" aria-pressed="false">Go live</button>
  </div>
</div></section>
<main>
  <p id="msg" role="status" aria-live="polite"></p>
  
  <div id="seg" class="chips"></div>
  <div id="view"></div>
</main>
</div></div>
<script>
const API='https://api.openf1.org/v1/';
const $=id=>document.getElementById(id);
const S={tab:'fast',charts:{},cache:{},stats:[],gb:{},metric:'trap',clean:true,picked:null,ta:null,tb:'',tok:0,session:null};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const say=(t,err)=>{$('msg').textContent=t;$('msg').className=err?'err':''};
const min=(a,f)=>a.reduce((m,x)=>{const v=f(x);return v!=null&&(m==null||v<m)?v:m},null);
const max=(a,f)=>a.reduce((m,x)=>{const v=f(x);return v!=null&&(m==null||v>m)?v:m},null);
const fmtLap=s=>{if(s==null)return'–';const m=Math.floor(s/60);return m+':'+(s-m*60).toFixed(3).padStart(6,'0')};
const fmtSec=s=>s==null?'–':s.toFixed(3);
const ranked=()=>S.stats.filter(s=>s.best).sort((a,b)=>a.best.lap_duration-b.best.lap_duration);

const memo=new Map(),stamps=[];let chain=Promise.resolve();
function api(path,mode){
  if(!mode&&memo.has(path))return Promise.resolve(memo.get(path));
  const run=chain.then(()=>fetchOne(path,mode));
  chain=run.catch(()=>{});
  return run;
}
async function fetchOne(path,mode){
  if(!mode&&memo.has(path))return memo.get(path);
  for(let i=0;i<5;i++){
    for(;;){
      const now=Date.now();while(stamps.length&&now-stamps[0]>61000)stamps.shift();
      const last=stamps.length?stamps[stamps.length-1]:0,wait=Math.max(stamps.length>=26?stamps[0]+61000-now:0,now-last<400?400-(now-last):0);
      if(wait<=0)break;
      if(wait>3000)say(`Pausing ${Math.ceil(wait/1000)} s to stay inside OpenF1's free limit of about 30 requests a minute…`);
      await sleep(wait);
    }
    stamps.push(Date.now());
    let r;
    try{r=await fetch(API+path,tk()?{headers:{Authorization:'Bearer '+tk()}}:undefined)}catch{throw new Error('Could not reach OpenF1. Check your internet connection and try again.')}
    if(r.status===404)return[];
    if(r.status===429){say('OpenF1 asked us to slow down. Waiting a few seconds…');await sleep(5000*(i+1));continue}
    if(!r.ok)throw new Error('OpenF1 answered with status '+r.status+'.');
    const j=await r.json();if(mode!==2)memo.set(path,j);return j;
  }
  throw new Error('OpenF1 is still limiting requests. Wait a minute and try again.');
}
function fill(id,rows){const s=$(id);s.innerHTML='';rows.forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;s.appendChild(o)})}

async function loadMeetings(){
  say('Loading Grands Prix…');
  try{
    const m=(await api('meetings?year='+$('year').value)).filter(x=>new Date(x.date_start)<=Date.now()).sort((a,b)=>new Date(a.date_start)-new Date(b.date_start));
    S.meet=m;fill('meeting',m.map(x=>[x.meeting_key,x.meeting_name]));
    if(!m.length){fill('session',[]);S.stats=[];render();return say('No sessions have run in this season yet.')}
    $('meeting').value=m[m.length-1].meeting_key;
    await loadSessions();
  }catch(e){say(e.message,1)}
}
async function loadSessions(){
  say('Loading sessions…');
  try{
    const s=(await api('sessions?meeting_key='+$('meeting').value)).filter(x=>new Date(x.date_start)<=Date.now()).sort((a,b)=>new Date(a.date_start)-new Date(b.date_start));
    fill('session',s.map(x=>[x.session_key,x.session_name]));
    if(!s.length){S.stats=[];render();return say('No sessions have run for this Grand Prix yet.')}
    $('session').value=s[s.length-1].session_key;
    await loadSession();
  }catch(e){say(e.message,1)}
}
async function loadSession(){
  const k=$('session').value;if(!k)return;
  say('Loading session data…');
  try{
    const [drivers,laps]=await Promise.all([api('drivers?session_key='+k),api('laps?session_key='+k)]);
    S.session=k;S.picked=null;S.ta=null;S.tb=null;
    S.drivers=drivers;S.allLaps=laps;await prepQ(1);recompute();render();
    say(S.stats.length?'':'OpenF1 has no lap data for this session yet.');
  }catch(e){say(e.message,1)}
}

function compute(drivers,laps){
  const by={};
  laps.forEach(l=>{(by[l.driver_number]??=[]).push(l)});
  S.stats=Object.entries(by).map(([n,ls])=>{
    const d=drivers.find(x=>x.driver_number==n)||{};
    const best=ls.filter(l=>l.lap_duration!=null&&!l.is_pit_out_lap).reduce((b,l)=>!b||l.lap_duration<b.lap_duration?l:b,null);
    const col=/^[0-9a-f]{6}$/i.test(d.team_colour||'')?'#'+d.team_colour:'#888888';
    const s={n:+n,code:d.name_acronym||'#'+n,team:d.team_name||'',col,laps:ls,best,
      s1:min(ls,l=>l.duration_sector_1),s2:min(ls,l=>l.duration_sector_2),s3:min(ls,l=>l.duration_sector_3),
      trap:max(ls,l=>l.st_speed),i1:max(ls,l=>l.i1_speed),i2:max(ls,l=>l.i2_speed)};
    s.theo=s.s1!=null&&s.s2!=null&&s.s3!=null?s.s1+s.s2+s.s3:null;
    return s;
  }).filter(s=>s.best||s.trap!=null);
  S.gb={s1:min(S.stats,s=>s.s1),s2:min(S.stats,s=>s.s2),s3:min(S.stats,s=>s.s3)};
}

const table=(heads,rows)=>`<div class="wrap"><table><thead><tr>${heads.map(h=>`<th class="${['Driver','Team','Track'].includes(h)?'l':''}">${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
const drv=s=>`<td class="l"><span class="drv"><i style="background:${s.col}"></i>${esc(s.code)}</span><small>${esc(s.team)}</small></td>`;
const cell=(v,best,own)=>`<td><span class="pill ${v!=null&&v===best?'p':v!=null&&v===own?'g':''}">${fmtSec(v)}</span></td>`;
const empty=()=>`<p class="empty">No data to show for this session yet. Pick another session, or come back once it has finished.</p>`;
const keyline=`<p class="key"><span class="p">Purple</span>session-best sector<span class="g">Green</span>the driver's own best sector</p>`;

function tFast(){
  const rows=ranked();if(!rows.length)return empty();
  const lead=rows[0].best.lap_duration;
  return keyline+table(['Pos','Driver','Best lap','Gap','Lap','S1','S2','S3','Top speed (km/h)'],rows.map((s,i)=>{
    const b=s.best;
    return `<tr><td>${i+1}</td>${drv(s)}<td><b>${fmtLap(b.lap_duration)}</b></td><td>${i?'+'+(b.lap_duration-lead).toFixed(3):'–'}</td><td>${b.lap_number}</td>`
      +cell(b.duration_sector_1,S.gb.s1,s.s1)+cell(b.duration_sector_2,S.gb.s2,s.s2)+cell(b.duration_sector_3,S.gb.s3,s.s3)+`<td>${b.st_speed??'–'}</td></tr>`;
  }));
}
function tSect(){
  const rows=S.stats.filter(s=>s.theo!=null).sort((a,b)=>a.theo-b.theo);if(!rows.length)return empty();
  const ult=S.gb.s1+S.gb.s2+S.gb.s3;
  return `<p class="key">The session-best sectors add up to a ${fmtLap(ult)} lap. Theoretical best is each driver's own best three sectors added together.</p>`
    +table(['Driver','Best S1','Best S2','Best S3','Theoretical best','Actual best'],rows.map(s=>
    `<tr>${drv(s)}${cell(s.s1,S.gb.s1)}${cell(s.s2,S.gb.s2)}${cell(s.s3,S.gb.s3)}<td><b>${fmtLap(s.theo)}</b></td><td>${s.best?fmtLap(s.best.lap_duration):'–'}</td></tr>`));
}
function tSpeed(){
  const k=S.metric,rows=S.stats.filter(s=>s[k]!=null);
  if(!rows.length)return `<p class="empty">This session has no speed readings yet.</p>`;
  const opt=(v,t)=>`<option value="${v}" ${v===k?'selected':''}>${t}</option>`;
  return `<div class="pick"><label>Measured at<select id="metric">${opt('trap','Speed trap')}${opt('i1','Intermediate 1')}${opt('i2','Intermediate 2')}</select></label></div>
  <div class="card"><div class="ch" style="height:${rows.length*28+60}px"><canvas id="c1"></canvas></div></div>`
  +table(['Driver','Speed trap (km/h)','Intermediate 1 (km/h)','Intermediate 2 (km/h)'],[...S.stats].sort((a,b)=>(b[k]??0)-(a[k]??0)).map(s=>`<tr>${drv(s)}<td>${s.trap??'–'}</td><td>${s.i1??'–'}</td><td>${s.i2??'–'}</td></tr>`));
}
function tLaps(){
  const r=ranked();if(!r.length)return empty();
  if(!S.picked)S.picked=new Set(r.slice(0,3).map(s=>s.n));
  return `<div class="chips">${r.map(s=>`<button class="chip ${S.picked.has(s.n)?'on':''}" data-n="${s.n}" style="--c:${s.col}" aria-pressed="${S.picked.has(s.n)}">${esc(s.code)}</button>`).join('')}</div>
  <label class="chk"><input type="checkbox" id="clean" ${S.clean?'checked':''}>Hide slow laps (pit stops, safety cars)</label>
  <div class="card"><div class="ch"><canvas id="c1"></canvas></div></div>`;
}
function tTele(){
  const r=ranked();if(!r.length)return empty();
  S.ta??=r[0].n;
  const opts=sel=>r.map(s=>`<option value="${s.n}" ${s.n==sel?'selected':''}>${esc(s.code)}  ${fmtLap(s.best.lap_duration)}</option>`).join('');
  return `<div class="pick"><label>Driver<select id="ta">${opts(S.ta)}</select></label>
  <label>Compare with<select id="tb"><option value="">Nobody</option>${opts(S.tb)}</select></label></div>
  <p class="key" id="tsum">Each driver's fastest lap, lined up from the start of the lap.</p>
  ${[0,1,2,3].map(i=>`<div class="card"><div class="ch" style="height:${i?190:280}px"><canvas id="tc${i}"></canvas></div></div>`).join('')}`;
}

function mk(id,cfg){
  S.charts[id]?.destroy();
  cfg.options={responsive:true,maintainAspectRatio:false,animation:false,...cfg.options};
  S.charts[id]=new Chart($(id),cfg);
}
function pSpeed(){
  const k=S.metric,rows=S.stats.filter(s=>s[k]!=null).sort((a,b)=>b[k]-a[k]);if(!rows.length)return;
  mk('c1',{type:'bar',data:{labels:rows.map(s=>s.code),datasets:[{data:rows.map(s=>s[k]),backgroundColor:rows.map(s=>s.col)}]},
    options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{min:Math.floor(rows[rows.length-1][k]/10)*10-10,title:{display:true,text:'km/h (axis does not start at zero)'}}}}});
}
function pLaps(){
  const rk=ranked();if(!rk.length)return;
  const cap=rk[0].best.lap_duration*1.15,used=new Set();
  const datasets=rk.filter(s=>S.picked.has(s.n)).map(s=>{
    const dash=used.has(s.col);used.add(s.col);
    return{label:s.code,borderColor:s.col,backgroundColor:s.col,borderWidth:2,pointRadius:2,tension:0,borderDash:dash?[6,4]:[],
      data:s.laps.filter(l=>l.lap_duration!=null&&(!S.clean||l.lap_duration<=cap)).map(l=>({x:l.lap_number,y:l.lap_duration}))};
  });
  mk('c1',{type:'line',data:{datasets},options:{scales:{x:{type:'linear',title:{display:true,text:'Lap'},ticks:{precision:0}},y:{title:{display:true,text:'Lap time'},ticks:{callback:v=>fmtLap(v)}}},
    plugins:{tooltip:{callbacks:{label:c=>`${c.dataset.label}, lap ${c.parsed.x}: ${fmtLap(c.parsed.y)}`}}}}});
}
async function lapTele(s){
  const key=S.session+':'+s.n+':'+s.best.lap_number;
  if(S.cache[key])return S.cache[key];
  if(!s.best.date_start)throw new Error('This lap has no start time, so there is no telemetry to match.');
  const t0=new Date(s.best.date_start),t1=new Date(t0.getTime()+s.best.lap_duration*1000);
  const iso=d=>d.toISOString().slice(0,-1);

  const y=$('year').value,d=S.ssn&&S.ssn.k===y&&S.ssn.rounds.length?S.ssn:null;
  if(!d)return;
  devel(d);const sel=selTeams(d),cmp=sel.length>0,m=cmp?(S.sm||'b'):(S.sm==='b'?'q':(S.sm||'q'));
  const names=d.rounds.map(r=>r.name),hasR=d.rounds.some(r=>r.rdone),val=(r,k,t)=>gp(r[k][t]),kinds=m==='b'?['q','r']:[m],KN={q:'Qualifying',r:'Race pace'};
  const line=(t,k,lab,dash)=>({label:lab,borderColor:d.teams[t],backgroundColor:d.teams[t],borderWidth:2,tension:.2,spanGaps:true,borderDash:dash?[6,4]:[],data:d.rounds.map(r=>val(r,k,t))});
  const ds=cmp?sel.flatMap(t=>kinds.map(k=>line(t,k,`${t} ${k==='q'?'qualifying':'race pace'}`,k==='r'))):Object.keys(d.teams).map(t=>line(t,m,t));
  mk('sc',{type:'line',data:{labels:names,datasets:ds},options:{scales:{y:{reverse:true,min:0,title:{display:true,text:'Percent behind the quickest car (higher on the chart is faster)'},ticks:{callback:v=>v.toFixed(1)+'%'}}},plugins:{tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${c.parsed.y.toFixed(2)}% behind`}}}}});
  const hint=!hasR&&kinds.includes('r')?'<p class="empty">Race pace has not been loaded yet. Press Add race pace above.</p>':'';
  const avg=(t,k)=>{const a=d.rounds.map(r=>val(r,k,t)).filter(v=>v!=null);return a.length?a.reduce((x,z)=>x+z)/a.length:null};
  if(cmp){
    const best=(t,k)=>{const a=d.rounds.filter(r=>val(r,k,t)!=null).sort((x,z)=>val(x,k,t)-val(z,k,t));return a.length?`best at ${a[0].name} (${val(a[0],k,t).toFixed(2)}%), worst at ${a[a.length-1].name} (${val(a[a.length-1],k,t).toFixed(2)}%)`:'no data yet'};
    const cols=sel.flatMap(t=>kinds.map(k=>[t,k])),pill=(v,lo)=>v==null?'–':`<span class="pill ${v<.0005?'p':v===lo?'g':''}">${v.toFixed(2)}%</span>`;
    const rows=d.rounds.map(r=>{const lo={};kinds.forEach(k=>{lo[k]=sel.length>1?min(sel,t=>val(r,k,t)):null});return `<tr><td class="l">${esc(r.name)}</td>${cols.map(([t,k])=>`<td>${pill(val(r,k,t),lo[k])}</td>`).join('')}</tr>`});
    rows.push(`<tr><td class="l"><b>Season average</b></td>${cols.map(([t,k])=>{const a=avg(t,k);return `<td><b>${a==null?'–':a.toFixed(2)+'%'}</b></td>`}).join('')}</tr>`);
    $('sx').innerHTML=hint+sel.map(t=>`<p class="key"><span class="drv"><i style="background:${d.teams[t]}"></i>${esc(t)}</span> ${kinds.map(k=>`${KN[k]} ${esc(best(t,k))}.`).join(' ')}</p>`).join('')
      +`<p class="key"><span class="p">Purple</span>quickest car that weekend<span class="g">Green</span>quickest of the teams you picked</p>`
      +table(['Track',...cols.map(([t,k])=>`${esc(t)} ${k==='q'?'quali':'race'}`)],rows);
  }else{
    const hc=v=>v==null?'<td>–</td>':`<td style="background:hsl(${Math.round(Math.max(0,1-v/2)*130)} 55% 27%)">${v<.0005?'<b>0.00</b>':v.toFixed(2)}</td>`;
    $('sx').innerHTML=(m==='r'?hint:'')+'<p class="key">Percent behind the quickest car each weekend. 0.00 means quickest.</p>'
      +table(['Team',...names,'Average'],Object.keys(d.teams).sort((a,b)=>(avg(a,m)??99)-(avg(b,m)??99)).map(t=>`<tr><td class="l"><span class="drv"><i style="background:${d.teams[t]}"></i>${esc(t)}</span></td>${d.rounds.map(r=>hc(val(r,m,t))).join('')}<td><b>${avg(t,m)!=null?avg(t,m).toFixed(2):'–'}</b></td></tr>`));
  }
}
const devHtml=()=>{const dm=S.dm||'c',o=(v,t)=>`<option value="${v}" ${v===dm?'selected':''}>${t}</option>`;
  return `<h2 class="sec">Development</h2><div class="pick"><label>Measured by<select id="dm">${o('c','Qualifying and race combined')}${o('q','Qualifying')}${o('r','Race pace')}</select></label></div><p class="key" id="dnote"></p><div class="card"><div class="ch" style="height:320px"><canvas id="dvc"></canvas></div></div><div class="card"><div class="ch" id="dvh"><canvas id="dvb"></canvas></div></div><div id="dvt"></div>`};
function devel(d){
  const sel=selTeams(d),teams=(sel.length?sel:Object.keys(d.teams)).sort(),dm=S.dm||'c';
  const mean=a=>a.length?a.reduce((x,z)=>x+z)/a.length:null;
  const g=(r,t)=>{const a=(dm==='c'?['q','r']:[dm]).map(k=>gp(r[k][t]));return a.some(v=>v==null)?null:mean(a)};
  const ser=t=>d.rounds.map(r=>g(r,t)),roll=s=>s.map((_,i)=>mean(s.slice(Math.max(0,i-2),i+1).filter(v=>v!=null)));
  const rows=teams.map(t=>{const v=ser(t).filter(x=>x!=null);if(v.length<4)return null;const e=mean(v.slice(0,3)),l=mean(v.slice(-3));return{t,e,l,c:e-l}}).filter(Boolean).sort((a,b)=>b.c-a.c);
  if(!rows.length){$('dnote').textContent=dm==='q'||d.rounds.some(r=>r.rdone)?'Development needs at least four races with data for the chosen measure.':'Race pace has not been loaded yet. Press Add race pace above, or measure development by qualifying.';return}
  mk('dvc',{type:'line',data:{labels:d.rounds.map(r=>r.name),datasets:teams.map(t=>({label:t,borderColor:d.teams[t],backgroundColor:d.teams[t],borderWidth:2,tension:.25,pointRadius:2,spanGaps:true,data:roll(ser(t))}))},
    options:{scales:{y:{reverse:true,min:0,title:{display:true,text:'Percent behind the quickest car, 3-race average (higher is faster)'},ticks:{callback:v=>v.toFixed(1)+'%'}}},plugins:{tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${c.parsed.y.toFixed(2)}% behind`}}}}});
  $('dvh').style.height=(rows.length*32+70)+'px';
  mk('dvb',{type:'bar',data:{labels:rows.map(r=>r.t),datasets:[{data:rows.map(r=>+r.c.toFixed(3)),backgroundColor:rows.map(r=>d.teams[r.t])}]},
    options:{indexAxis:'y',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.parsed.x>=0?'Closed the gap by':'Fell back by'} ${Math.abs(c.parsed.x).toFixed(2)} points`}}},scales:{x:{title:{display:true,text:'Gap to the quickest car closed, in percentage points (negative means it fell back)'}}}}});
  const b=rows[0],w=rows[rows.length-1];
  $('dnote').textContent=`${b.t} developed best, closing the gap by ${b.c.toFixed(2)} points (from ${b.e.toFixed(2)}% behind in the first three races to ${b.l.toFixed(2)}% in the last three).`+(w.c<0?` ${w.t} lost the most ground, falling back by ${Math.abs(w.c).toFixed(2)} points.`:'')+' Gaps are measured against whoever was quickest each weekend, so a rival\'s progress also moves a team\'s number.';
  $('dvt').innerHTML=table(['Team','First 3 races','Last 3 races','Gap closed (points)'],rows.map((r,i)=>`<tr><td class="l"><span class="drv"><i style="background:${d.teams[r.t]}"></i>${esc(r.t)}</span></td><td>${r.e.toFixed(2)}%</td><td>${r.l.toFixed(2)}%</td><td><span class="pill ${i===0&&r.c>0?'p':r.c>0?'g':''}">${r.c>=0?'+':''}${r.c.toFixed(2)}</span></td></tr>`));
}
const sec=t=>`<h2 class="sec">${t}</h2>`;
function tPace(){
  const r=ranked();if(!r.length)return empty();
  const cap=r[0].best.lap_duration*1.15,med=a=>{const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
  const rows=r.map(s=>{const c=s.laps.filter(l=>l.lap_duration!=null&&!l.is_pit_out_lap&&l.lap_duration<=cap).map(l=>l.lap_duration);return{s,n:c.length,m:c.length?med(c):null}}).filter(x=>x.m!=null).sort((a,b)=>a.m-b.m);
  return `<p class="key">Median of each driver's clean laps: no pit laps and nothing slower than 115% of the quickest lap.</p>`
  +table(['Driver','Clean laps','Median lap','Gap','Best lap'],rows.map((x,i)=>`<tr>${drv(x.s)}<td>${x.n}</td><td><b>${fmtLap(x.m)}</b></td><td>${i?'+'+(x.m-rows[0].m).toFixed(3):'–'}</td><td>${fmtLap(x.s.best.lap_duration)}</td></tr>`));
}
const tWeather=()=>`<p class="key" id="wsum">Loading weather…</p><div class="card"><div class="ch" style="height:240px"><canvas id="wc"></canvas></div></div>`;
async function pWeather(){
  const tok=++S.tok;
  try{
    const w=S.wx&&S.wx.k===S.session?S.wx.d:(S.wx={k:S.session,d:await api('weather?session_key='+S.session)}).d;
    if(tok!==S.tok||!$('wc'))return;
    if(!w.length){$('wsum').textContent='OpenF1 has no weather data for this session.';return}
    const t0=Date.parse(w[0].date);
    mk('wc',{type:'line',data:{datasets:[['track_temperature','Track °C','#ff8a3d'],['air_temperature','Air °C','#5cc8ff']].map(([k,l,c])=>({label:l,borderColor:c,borderWidth:2,pointRadius:0,data:w.map(r=>({x:(Date.parse(r.date)-t0)/60000,y:r[k]}))}))},
      options:{scales:{x:{type:'linear',title:{display:true,text:'Minutes into the session data'}},y:{title:{display:true,text:'°C'}}}}});
    const z=w[w.length-1];
    $('wsum').textContent=`Latest: track ${z.track_temperature}°C, air ${z.air_temperature}°C, humidity ${z.humidity}%, wind ${z.wind_speed} m/s. ${w.some(r=>r.rainfall>0)?'Rain was recorded.':'No rain recorded.'}`;
  }catch(e){if(tok===S.tok)say(e.message,1)}
}
const seq=(...f)=>async()=>{for(const x of f)await x()};
const TABS={
 live:['Live Dashboard',tLive,null,'live'],
 qres:['Qualifying',tQres,null,'flag'],
 fast:['Fastest Laps',tFast,null,'timer'],
 pace:['Race Pace Insights',()=>tLaps()+sec('Pace summary')+tPace(),pLaps,'zap'],
 tele:['Telemetry Analyser',tTele,pTele,'pulse'],
 maps:['Sectors & Maps',()=>sec('Sector bests')+tSect()+sec('Track map')+tTrack(),pTrack,'map'],
 cars:['Car Performance',()=>tSpeed()+sec('Tyre degradation')+tDeg(),seq(pSpeed,pDeg),'car'],
 season:['Season Performance',tSeason,pSeason,'trend',true],
 pos:['Race Positions',tPos,pPos,'list'],
 rc:['Race Control & Radio',tRc,pRc,'chat'],
 strategy:['Strategy & Weather',()=>sec('Tyre stints')+tTyres()+sec('Pit stops')+tPits()+sec('Weather')+tWeather(),seq(pTyres,pPits,pWeather),'cloud']
};
function render(){hero();segBar();cancelAnimationFrame(S.raf);S.raf=0;
  Object.values(S.charts).forEach(c=>c.destroy());S.charts={};
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===S.tab));
  const t=TABS[S.tab];
  const ok=S.stats.length||t[4];$('view').innerHTML=ok?t[1]():empty();
  if(ok&&t[2])t[2]();
}

$('tabs').innerHTML=Object.entries(TABS).map(([k,v])=>`<button role="tab" data-tab="${k}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[v[3]]}</svg><span>${v[0]}</span></button>`).join('');
$('tabs').onclick=e=>{const b=e.target.closest('button');if(b){S.tab=b.dataset.tab;render()}};
$('view').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;if(b.dataset.d!==undefined)return degPick(b.dataset.d);if(b.dataset.t!==undefined)return teamPick(b.dataset.t);const n=+b.dataset.n;S.picked.has(n)?S.picked.delete(n):S.picked.add(n);render()};
$('view').onchange=e=>{const t=e.target;
  if(t.id==='metric'){S.metric=t.value;render()}
  else if(t.id==='clean'){S.clean=t.checked;render()}
  else if(t.id==='fuel'){S.fuel=t.checked;render()}
  else if(t.id==='dm'){S.dm=t.value;render()}
  else if(t.id==='sm'){S.sm=t.value;render()}
  else if(t.id==='st'){S.st=t.value;render()}
  else if(t.id==='rdv'){S.rdv=t.value;radio()}
  else if(t.id==='cb'){S.cb=t.value;render()}
  else if(t.id==='nm'){S.nm=+t.value;render()}
  else if(t.id==='ta'||t.id==='tb'){S.ta=$('ta').value;S.tb=$('tb')?$('tb').value:S.tb;render()}};
$('seg').onclick=e=>{const b=e.target.closest('[data-seg]');if(!b)return;S.seg=+b.dataset.seg;S.picked=null;S.ta=null;S.tb=null;recompute();render()};
$('live').onclick=async()=>{
  if(S.liveOn){setLive(false);return say('Live mode is off.')}
  setLive(true);S.tab='live';$('year').value=String(nowY);say('Finding the latest session…');await loadMeetings();
};
$('year').onchange=loadMeetings;$('meeting').onchange=loadSessions;$('session').onchange=loadSession;

Chart.defaults.font.family='Barlow,system-ui,sans-serif';Chart.defaults.color='#9a9ec6';Chart.defaults.borderColor='rgba(255,255,255,.09)';
const nowY=new Date().getFullYear();
fill('year',Array.from({length:nowY-2022},(_,i)=>[nowY-i,nowY-i]));
loadMeetings();
</script>
